<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결과 그래프 — 인생 갈림길</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f5d4a'/%3E%3Cpath d='M32 54V34M32 34 18 16M32 34l14-18' stroke='%23f6e7c1' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700;800&display=block" rel="stylesheet" crossorigin="anonymous">
<style>
/* 발표 PPT(행조 4조 발표 ppt)와 같은 배경·글꼴·색. 외적·내적 색은 PPT 9번 표의 계열에서 색각 검사를 통과하도록 고른 값. */
:root {
  --bg: #FFFBF2; --card: #FDFAF1; --title: #000; --sub: #595959; --ink: #23313A; --ink-2: #4E5357; --muted: #8C8F8E; --line: #E6E0D4; --track: #EBE7DE;
  --ext: #D46A45; --int: #00897B; --ext-ink: #824E3C; --int-ink: #315C50; --ext-soft: #FAEDE7; --int-soft: #E9F2EF;
  --first: #C8A182; --second: #6D4C41; --same: #B9B0A3;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; --display: 'Jua', 'Noto Sans KR', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #16201c; overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
#title { position: absolute; left: 83px; top: 122px; margin: 0; font-family: var(--display); font-weight: 400; font-size: 68px; line-height: 1; color: var(--title); letter-spacing: -.5px; }
#sub { position: absolute; left: 85px; top: 265px; margin: 0; font-weight: 300; font-size: 44px; line-height: 1; color: var(--sub); letter-spacing: 5.5px; }
#view { position: absolute; left: 86px; right: 86px; top: 380px; bottom: 60px; }
.empty { height: 100%; display: grid; place-items: center; text-align: center; font-size: 34px; font-weight: 500; color: var(--ink-2); line-height: 1.6; }
.empty small { display: block; font-size: 24px; color: var(--muted); font-weight: 400; }

/* 범례 */
.legend { display: flex; gap: 36px; align-items: center; font-size: 26px; font-weight: 700; color: var(--ink-2); }
.legend i { display: inline-block; width: 26px; height: 26px; border-radius: 7px; margin-right: 10px; vertical-align: -4px; }
.legend i.light { box-shadow: inset 0 0 0 2px #CFC6B8; }
.legend small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.foot { position: absolute; left: 0; bottom: 0; font-size: 22px; color: var(--muted); }

/* 100% 누적 가로 막대 */
.hrows { display: flex; flex-direction: column; gap: 46px; margin-top: 56px; }
.hrow { display: grid; grid-template-columns: 330px 1fr; align-items: center; gap: 30px; }
.hrow .who b { display: block; font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--ink); }
.hrow .who span { display: block; margin-top: 6px; font-size: 23px; color: var(--muted); }
.stack { display: flex; gap: 4px; height: var(--h, 150px); }
.seg { position: relative; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; padding: 0 28px; color: #fff; min-width: 0; overflow: visible; }
.seg.ext { background: var(--ext); } .seg.int { background: var(--int); align-items: flex-end; text-align: right; }
.seg b { font-family: var(--display); font-weight: 400; font-size: 52px; line-height: 1.05; white-space: nowrap; }
.seg span { font-size: 22px; font-weight: 500; opacity: .95; white-space: nowrap; }
.seg.narrow b, .seg.narrow span { position: absolute; top: 100%; margin-top: 8px; color: var(--ink); font-size: 26px; }
.seg.narrow span { display: none; }

/* 나이대 */
.age { display: grid; grid-template-columns: 1fr 470px; gap: 60px; height: 100%; }
.cols { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 70px; align-items: end; height: 100%; padding-bottom: 96px; }
.col { position: relative; display: flex; flex-direction: column; gap: 4px; height: 100%; justify-content: flex-end; }
.col .vseg { border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; min-height: 0; }
.col .vseg.ext { background: var(--ext); } .col .vseg.int { background: var(--int); }
.col .vseg b { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1.1; }
.col .vseg span { font-size: 21px; font-weight: 500; }
.col .vseg.thin b { font-size: 30px; } .col .vseg.thin span { display: none; }
.col .cap { position: absolute; left: 0; right: 0; bottom: -92px; text-align: center; }
.col .cap b { display: block; font-family: var(--display); font-weight: 400; font-size: 36px; }
.col .cap span { font-size: 22px; color: var(--muted); }
.trend { position: absolute; inset: 0 0 96px 0; pointer-events: none; overflow: visible; }
.callout { align-self: center; background: var(--ext-soft); border-radius: 26px; padding: 44px 46px; }
.callout p { margin: 0; font-size: 28px; font-weight: 700; color: var(--ext-ink); line-height: 1.4; }
.callout .big { font-family: var(--display); font-size: 120px; line-height: 1.1; color: var(--ink); margin: 14px 0 6px; }
.callout .big small { font-size: 52px; margin-left: 4px; }
.callout span { font-size: 23px; color: var(--muted); }

/* 15-1: 나이별 점 그림 */
.dots-wrap { display: flex; flex-direction: column; height: 100%; }
.legend i.dot { border-radius: 50%; }
.legend .unit { margin-left: auto; font-weight: 400; font-size: 23px; color: var(--muted); }
svg.dots { display: block; margin-top: 18px; overflow: visible; }
.dots .band { fill: #F4ECDD; }
.dots .band-label { font: 700 24px var(--sans); fill: var(--muted); }
.dots .guide { stroke: #E9E1D2; stroke-width: 2; }
.dots .zero { stroke: #CFC6B8; stroke-width: 3; }
.dots .ylab { font: 700 27px var(--sans); }
.dots .age-label { font-family: var(--display); font-size: 32px; fill: var(--ink); }
.dots .era { font: 500 20px var(--sans); fill: var(--muted); }
.dots .count { font-family: var(--display); font-size: 30px; }
.dots .grid { stroke: #E6DFD2; stroke-width: 2; stroke-dasharray: 6 8; }
.dots .path { fill: none; stroke: #6D4C41; stroke-width: 2.4; stroke-opacity: .2; }
.dots .trend-halo { fill: none; stroke: var(--bg); stroke-width: 15; stroke-linecap: round; stroke-opacity: .9; }
.dots .trend { fill: none; stroke: #3E2723; stroke-width: 6; stroke-linecap: round; }
.legend svg { vertical-align: -6px; margin-right: 10px; }

/* 엔딩 */
.two { display: grid; grid-template-columns: 560px 1fr; gap: 70px; height: 100%; }
.ring { text-align: center; }
.ring svg { display: block; width: 420px; height: 420px; margin: 0 auto; }
.ring .center-big { font-family: var(--display); font-size: 96px; fill: var(--ink); }
.ring .center-small { font-size: 26px; font-weight: 700; fill: var(--ink-2); }
.ring .center-count { font-size: 23px; fill: var(--muted); }
.ring .legend { justify-content: center; margin-top: 26px; font-size: 24px; }
.bars { position: relative; display: flex; flex-direction: column; height: 100%; }
.bars .legend { justify-content: flex-end; }
.groups { flex: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 34px; align-items: end; border-bottom: 3px solid var(--line); margin-top: 24px; }
.group { display: flex; gap: 6px; align-items: flex-end; justify-content: center; height: 100%; }
.vbar { width: 62px; border-radius: 10px 10px 0 0; position: relative; min-height: 4px; }
.vbar.first { background: var(--first); } .vbar.second { background: var(--second); }
.vbar em { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; font-style: normal; font-family: var(--display); font-size: 32px; color: var(--ink); }
.xlabels { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 34px; margin-top: 14px; }
.xlabels div { text-align: center; font-size: 26px; font-weight: 700; color: var(--ink); }
.xlabels i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: 3px; }
.note { margin-top: 26px; font-size: 26px; color: var(--ink-2); }
.note b { color: var(--ink); }

/* 이동 */
.shift .hrows { margin-top: 40px; gap: 34px; }
.shift .hrow { grid-template-columns: 110px 1fr; }
.shift .stack { --h: 120px; }
.shift .seg b { font-size: 44px; }
.delta { display: inline-block; margin: 26px 0 0 140px; padding: 10px 24px; border-radius: 999px; background: var(--int-soft); color: var(--int-ink); font-size: 26px; font-weight: 700; }
.delta.ext { background: var(--ext-soft); color: var(--ext-ink); }
.movers { display: flex; flex-direction: column; gap: 26px; margin-top: 40px; }
.mover { display: grid; grid-template-columns: 250px 1fr; align-items: center; gap: 20px; }
.mover > b { font-size: 27px; font-weight: 700; color: var(--ink); }
.mover .hb { display: flex; align-items: center; gap: 16px; }
.mover .hb i { height: 70px; border-radius: 0 12px 12px 0; min-width: 6px; }
.mover .hb em { font-style: normal; font-family: var(--display); font-size: 40px; color: var(--ink); white-space: nowrap; }
.mover .hb em small { font-family: var(--sans); font-size: 22px; color: var(--muted); margin-left: 8px; }
.h3 { margin: 0; font-size: 28px; font-weight: 700; color: var(--ink-2); }

/* 조작 (H로 숨김) */
#nav { position: fixed; right: 18px; bottom: 16px; display: flex; gap: 8px; align-items: center; z-index: 5; transition: opacity .3s; font-family: var(--sans); }
#nav button { border: none; border-radius: 999px; padding: 9px 16px; background: rgba(255, 251, 242, .95); color: #333; font: 600 15px var(--sans); cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
#nav button.on { background: #4E342E; color: #fff; }
#nav .state { color: #ddd; font-size: 13px; margin-right: 6px; }
body.idle #nav { opacity: .15; }
body.clean #nav { display: none !important; }
body.embed #nav { display: none !important; }
#table { position: fixed; inset: 40px; z-index: 6; background: #fffbf2; border-radius: 16px; padding: 24px 30px; overflow: auto; font: 16px var(--sans); box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
#table table { border-collapse: collapse; margin: 8px 0 22px; }
#table th, #table td { border-bottom: 1px solid #e4dccb; padding: 6px 18px 6px 0; text-align: left; }
</style>
</head>
<body>
<div id="stage"><h1 id="title"></h1><p id="sub"></p><main id="view"></main></div>
<nav id="nav"></nav>
<div id="table" hidden></div>
<!--__CONFIG__-->
<script type="application/json" id="game-data">/*__DATA__*/</script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const CONFIG = JSON.parse($('#game-config').textContent), DATA = JSON.parse($('#game-data').textContent);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const DEMO = /demo/.test(location.search + location.hash);
  if (/embed/.test(location.search)) document.body.classList.add('embed'); // 발표자 페이지 미리보기 안에서는 조작 버튼을 숨긴다

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('#stage');
    st.style.transform = `scale(${s})`; st.style.left = `${(innerWidth - 1920 * s) / 2}px`; st.style.top = `${(innerHeight - 1080 * s) / 2}px`;
  }
  addEventListener('resize', fit); fit();

  // ---------- 질문 분류 (content.json의 게이지 family에서 build가 계산) ----------
  const PERIODS = [{ key: 'young', name: '청년기', range: '10·20대', max: 30 }, { key: 'middle', name: '중년기', range: '30·40대', max: 50 }, { key: 'old', name: '노년기', range: '50대 이상', max: 200 }];
  // 미리보기: 게이지가 아직 내적·외적으로 나뉘지 않았을 때도 디자인을 볼 수 있게 가상 구성을 쓴다.
  const DEMO_STAGES = [15, 21, 26, 33, 37, 43, 47, 54, 62, 75].map((age, k) => ({ id: `s${k}`, age, goals: k % 3 === 1 ? ['intrinsic', 'extrinsic'] : ['extrinsic', 'intrinsic'] }));
  const DEMO_ENDINGS = [['money', '돈', 'extrinsic'], ['fame', '인정', 'extrinsic'], ['bond', '관계', 'intrinsic'], ['health', '건강', 'intrinsic'], ['balance', '균형', null]].map(([key, label, family]) => ({ key, label, family }));
  const ready = DATA.stages.some(s => s.goals.some(Boolean));
  const STAGES = DEMO && !ready ? DEMO_STAGES : DATA.stages, ENDINGS = DEMO && !ready ? DEMO_ENDINGS : DATA.endings;
  const goalOf = Object.fromEntries(STAGES.map(s => [s.id, s.goals]));
  const periodOf = Object.fromEntries(STAGES.map(s => [s.id, PERIODS.find(p => s.age < p.max).key]));
  const SPLIT = STAGES.filter(st => st.goals[0] && st.goals[1]); // 외적·내적이 갈리는 질문만
  const famLabels = f => DATA.dims.filter(d => d.family === f).map(d => d.label).join(' · ') || (f === 'extrinsic' ? '돈 · 인정' : '관계 · 건강');

  function demoPlays() {
    let a = 20261112;
    const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const play = (lean, old) => {
      const picks = STAGES.map(s => { const p = lean + (periodOf[s.id] === 'old' ? old : 0), wantInt = r() < p; return { stage: s.id, opt: s.goals[0] === (wantInt ? 'intrinsic' : 'extrinsic') ? 0 : 1 }; });
      const ints = picks.filter(p => goalOf[p.stage][p.opt] === 'intrinsic').length, fam = ints > 5 ? 'intrinsic' : ints < 5 ? 'extrinsic' : null;
      const pool = ENDINGS.filter(e => e.family === fam);
      return { ending: (pool.length ? pool[Math.floor(r() * pool.length)] : ENDINGS.at(-1)).key, picks };
    };
    return Array.from({ length: 38 }, (_, i) => { const lean = .3 + r() * .35; return { first: play(lean, .1), last: i < 34 ? play(lean + .13 * r(), .12) : null }; });
  }

  // ---------- 집계 ----------
  function goalCount(play, period) {
    const c = { intrinsic: 0, extrinsic: 0 };
    for (const p of play.picks || []) { const g = goalOf[p.stage]?.[p.opt]; if (g && (!period || periodOf[p.stage] === period)) c[g]++; }
    return c;
  }
  const sum = (plays, period) => plays.reduce((t, pl) => { const c = goalCount(pl, period); t.intrinsic += c.intrinsic; t.extrinsic += c.extrinsic; return t; }, { intrinsic: 0, extrinsic: 0 });
  function stats(people) {
    const first = people.map(p => p.first), pairs = people.filter(p => p.last);
    const by = (list, key) => Object.fromEntries(ENDINGS.map(e => [e.key, list.filter(x => x[key].ending === e.key).length]));
    const moves = {}; for (const p of pairs) if (p.first.ending !== p.last.ending) { const k = `${p.first.ending}>${p.last.ending}`; moves[k] = (moves[k] || 0) + 1; }
    const top = Object.entries(moves).sort((a, b) => b[1] - a[1])[0];
    const shift = { toInt: 0, same: 0, toExt: 0 };
    for (const p of pairs) { const d = goalCount(p.last).intrinsic - goalCount(p.first).intrinsic; shift[d > 0 ? 'toInt' : d < 0 ? 'toExt' : 'same']++; }
    return {
      people: people.length, pairs: pairs.length, first: sum(first), second: sum(pairs.map(p => p.last)), firstOfPairs: sum(pairs.map(p => p.first)),
      periods: PERIODS.map(p => ({ ...p, ...sum(first, p.key) })),
      oldExt: first.filter(pl => goalCount(pl, 'old').extrinsic > 0).length,
      paths: first.map(pl => SPLIT.map(st => { const p = (pl.picks || []).find(x => x.stage === st.id), g = p && goalOf[st.id][p.opt]; return g ? (g === 'extrinsic' ? 1 : -1) : null; })),
      ages: SPLIT.map(st => {
        const c = { extrinsic: 0, intrinsic: 0 };
        for (const pl of first) { const p = (pl.picks || []).find(x => x.stage === st.id), g = p && goalOf[st.id][p.opt]; if (g) c[g]++; }
        return { age: st.age, era: st.era || '', ...c };
      }),
      changed: pairs.filter(p => p.first.ending !== p.last.ending).length,
      before: by(pairs, 'first'), after: by(pairs, 'last'), top: top && { from: top[0].split('>')[0], to: top[0].split('>')[1], n: top[1] }, shift,
    };
  }

  // ---------- 그리기 ----------
  const endingLabel = k => ENDINGS.find(e => e.key === k)?.label || k;
  const legendGoals = () => `<div class="legend"><span><i style="background:var(--ext)"></i>외적 목표<small>${esc(famLabels('extrinsic'))}</small></span><span><i style="background:var(--int)"></i>내적 목표<small>${esc(famLabels('intrinsic'))}</small></span></div>`;
  function stack(ext, int, unit) {
    const t = ext + int, pe = pct(ext, t), pi = 100 - pe;
    const seg = (cls, p, n, name) => `<div class="seg ${cls} ${p < 14 ? 'narrow' : ''}" style="flex:${Math.max(p, .001)}" title="${name} ${p}% (${n}${unit})"><b>${name} ${p}%</b><span>${n}${unit}</span></div>`;
    return `<div class="stack">${seg('ext', pe, ext, '외적')}${seg('int', pi, int, '내적')}</div>`;
  }
  const empty = (msg, sub = '') => `<div class="empty"><div>${msg}${sub ? `<small>${sub}</small>` : ''}</div></div>`;

  function viewShare(s) {
    if (!s.people) return empty('1차 플레이가 끝나면 여기에 나타나요.');
    const he = +extra.hands_ext || 0, hi = +extra.hands_int || 0, rows = [];
    if (he + hi) rows.push(`<div class="hrow"><div class="who"><b>손들기로 본 우리 반</b><span>스스로 생각한 비중 · ${he + hi}명</span></div>${stack(he, hi, '명')}</div>`);
    rows.push(`<div class="hrow"><div class="who"><b>게임 속 선택</b><span>1차 플레이 ${s.people}명 · 선택 ${s.first.intrinsic + s.first.extrinsic}개</span></div>${stack(s.first.extrinsic, s.first.intrinsic, '개')}</div>`);
    return `${legendGoals()}<div class="hrows" style="--h:${rows.length > 1 ? 130 : 170}px">${rows.join('')}</div><div class="foot">1차 플레이에서 고른 모든 선택을 외적·내적 목표로 나눠 센 비율입니다.</div>`;
  }

  function viewAge(s) {
    if (!s.people) return empty('1차 플레이가 끝나면 여기에 나타나요.');
    const cols = s.periods.map(p => {
      const t = p.intrinsic + p.extrinsic, pe = pct(p.extrinsic, t), pi = 100 - pe;
      const v = (cls, q, n, name) => `<div class="vseg ${cls} ${q < 12 ? 'thin' : ''}" style="flex:${Math.max(q, .001)}" title="${p.name} ${name} ${q}% (${n}개)"><b>${name} ${q}%</b><span>${n}개</span></div>`;
      return `<div class="col">${t ? v('int', pi, p.intrinsic, '내적') + v('ext', pe, p.extrinsic, '외적') : ''}<div class="cap"><b>${p.name}</b><span>${p.range} · 선택 ${t}개</span></div></div>`;
    }).join('');
    const hasOld = STAGES.some(st => periodOf[st.id] === 'old' && st.goals.includes('extrinsic'));
    return `<div class="age"><div style="display:flex;flex-direction:column;height:100%">${legendGoals()}<div class="cols" style="margin-top:40px;flex:1">${cols}<svg class="trend"></svg></div></div>
      ${hasOld ? `<div class="callout"><p>노년기에도<br>외적 목표를 고른 사람</p><div class="big">${s.oldExt}<small>명</small></div><span>1차 플레이 ${s.people}명 중</span></div>` : '<div></div>'}</div>`;
  }
  // 외적 막대의 꼭대기를 점선으로 이어 나이대 흐름을 보여 준다.
  function drawTrend() {
    const svg = $('.trend'); if (!svg) return;
    const box = svg.getBoundingClientRect(), k = 1920 / $('#stage').getBoundingClientRect().width;
    const pts = [...document.querySelectorAll('.col')].map(c => { const e = c.querySelector('.vseg.ext'); if (!e) return null; const r = e.getBoundingClientRect(); return [(r.left + r.width / 2 - box.left) * k, (r.top - box.top) * k]; }).filter(Boolean);
    svg.innerHTML = pts.length > 1 ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--ext-ink)" stroke-width="3" stroke-dasharray="10 10" opacity=".6"/>${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="var(--bg)" stroke="var(--ext-ink)" stroke-width="3"/>`).join('')}` : '';
  }

  // ---------- 굵은 선: 외적 +1, 내적 −1로 놓고 모든 선택과의 오차 제곱(RMSE)이 가장 작은 다항식 ----------
  // 차수를 올릴수록 RMSE는 계속 줄지만 나이별 평균을 그대로 꿰는 구불구불한 선이 된다. 그래서 한 사람씩 빼고 맞춰 본
  // 예측 RMSE(교차검증)가 가장 작은 차수(1~3차)를 고른 뒤, 그 차수로 모든 점에 대해 RMSE가 최소인 곡선을 구한다.
  function polyFit(pts, deg) {
    const n = deg + 1, A = Array.from({ length: n }, () => Array(n + 1).fill(0));
    for (const [t, y] of pts) { const p = Array.from({ length: n }, (_, i) => t ** i); for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) A[i][j] += p[i] * p[j]; A[i][n] += p[i] * y; } }
    for (let i = 0; i < n; i++) {
      let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
      [A[i], A[m]] = [A[m], A[i]]; if (Math.abs(A[i][i]) < 1e-12) return null;
      for (let r = 0; r < n; r++) if (r !== i) { const f = A[r][i] / A[i][i]; for (let c = i; c <= n; c++) A[r][c] -= f * A[i][c]; }
    }
    return A.map((row, i) => row[n] / row[i]);
  }
  const polyAt = (c, t) => c.reduce((sum, a, i) => sum + a * t ** i, 0);
  function trendOf(paths, ages) {
    const T = a => (a - 40) / 25, ptsOf = list => list.flatMap(v => v.map((y, k) => y == null ? null : [T(ages[k]), y]).filter(Boolean));
    const all = ptsOf(paths), maxDeg = Math.min(3, new Set(ages).size - 1);
    if (all.length < 3 || maxDeg < 1) return null;
    let deg = Math.min(2, maxDeg), cv = null;
    if (paths.length >= 4) {
      for (let d = 1; d <= maxDeg; d++) {
        let se = 0, n = 0;
        for (let i = 0; i < paths.length && se < Infinity; i++) { const c = polyFit(ptsOf(paths.filter((_, j) => j !== i)), d); if (!c) { se = Infinity; break; } for (const [t, y] of ptsOf([paths[i]])) { se += (polyAt(c, t) - y) ** 2; n++; } }
        const e = n ? Math.sqrt(se / n) : Infinity;
        if (cv == null || e < cv - 1e-9) { cv = e; deg = d; }
      }
    }
    const c = polyFit(all, deg); if (!c) return null;
    return { deg, c, rmse: Math.sqrt(all.reduce((sum, [t, y]) => sum + (polyAt(c, t) - y) ** 2, 0) / all.length), at: a => polyAt(c, T(a)) };
  }

  // 15-1: 가로는 나이, 위(+1)는 외적·아래(−1)는 내적 선택. 점 하나가 한 사람의 1차 선택 하나다.
  // 사람마다 고정된 자리(외적을 많이 고른 사람일수록 위)가 있어서, 한 사람의 점은 늘 같은 높이에 찍히고
  // 그 점들을 부드러운 선으로 잇는다. 그대로면 수평선, 외적↔내적을 오가면 S자 곡선이 된다.
  function viewDots(s) {
    if (!s.people) return empty('1차 플레이가 끝나면 여기에 나타나요.');
    const cols = s.ages, paths = s.paths, ages = cols.map(c => c.age), N = paths.length;
    if (!cols.length) return empty('외적·내적이 갈리는 질문이 없어요.');
    const W = 1748, H = 546, L = 200, R = 120, T = 46, B = 104, J = .42, gap = 3;
    const yc = T + (H - T - B) / 2, A = ((H - T - B) / 2 - 36) / (1 + J), band = 2 * J * A, yv = v => yc - v * A;
    const amin = 10, amax = 68, x = a => L + (a - amin) / (amax - amin) * (W - L - R);
    const room = Math.min(260, ...cols.slice(1).map((c, i) => x(c.age) - x(cols[i].age))) - 22;
    // 자리 배치: 띠 높이에 들어가는 줄 수와 칸 수를 사람 수에 맞춰 고른다.
    let d = 6, K = Math.ceil(N / Math.max(1, Math.floor(band / (6 + gap))));
    for (let dd = 16; dd >= 6; dd -= 1) { const k = Math.ceil(N / Math.max(1, Math.floor(band / (dd + gap)))); if (k * (dd + gap) - gap <= room) { d = dd; K = k; break; } }
    const rows = Math.ceil(N / K), score = v => v.reduce((t, y) => t + (y || 0), 0);
    const rank = []; paths.map((v, i) => [i, score(v)]).sort((a, b) => b[1] - a[1] || a[0] - b[0]).forEach(([i], r) => { rank[i] = r; });
    const seat = i => { const r = rank[i], row = Math.floor(r / K), inRow = Math.min(K, N - row * K), col = r % K; return { dx: (col - (inRow - 1) / 2) * (d + gap), dy: rows > 1 ? (.5 - row / (rows - 1)) * band : 0 }; };
    const pos = (i, k) => { const v = paths[i][k]; if (v == null) return null; const st = seat(i); return [x(ages[k]) + st.dx, yv(v) - st.dy]; };
    // 한 사람의 선: 점마다 기울기 0으로 잇는 3차 곡선 (같은 쪽이면 수평, 바뀌면 부드러운 S자)
    const smooth = pts => pts.map(([px, py], k) => { if (!k) return `M${px.toFixed(1)} ${py.toFixed(1)}`; const [qx, qy] = pts[k - 1], h = (px - qx) / 2; return `C${(qx + h).toFixed(1)} ${qy.toFixed(1)} ${(px - h).toFixed(1)} ${py.toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}`; }).join('');
    const lines = paths.map((v, i) => { const pts = v.map((_, k) => pos(i, k)).filter(Boolean); return pts.length > 1 ? `<path class="path" d="${smooth(pts)}"/>` : ''; }).join('');
    const dots = paths.map((v, i) => v.map((y, k) => { const p = pos(i, k); return p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${d / 2}" fill="${y > 0 ? 'var(--ext)' : 'var(--int)'}"/>` : ''; }).join('')).join('');
    const tr = trendOf(paths, ages); // 굵은 선
    let trend = '';
    if (tr) {
      const pts = []; for (let a = ages[0]; a <= ages.at(-1) + 1e-9; a += .5) pts.push([x(a), yv(Math.max(-1 - J, Math.min(1 + J, tr.at(a))))]);
      const dpath = pts.map(([px, py], k) => `${k ? 'L' : 'M'}${px.toFixed(1)} ${py.toFixed(1)}`).join('');
      trend = `<g><title>RMSE가 가장 작은 ${tr.deg}차 곡선 (RMSE ${tr.rmse.toFixed(2)}): ${cols.map(c => `${c.age}세 ${tr.at(c.age).toFixed(2)}`).join(', ')}</title><path class="trend-halo" d="${dpath}"/><path class="trend" d="${dpath}"/></g>`;
    }
    const bands = [['청년기', amin, 30], ['중년기', 30, 50], ['노년기', 50, amax]].map(([name, a, b], k) =>
      `${k % 2 ? '' : `<rect class="band" x="${x(a)}" y="${T - 6}" width="${x(b) - x(a)}" height="${H - B - T + 6}" rx="14"/>`}<text class="band-label" x="${x(a) + 18}" y="${T - 16}">${name}</text>`).join('');
    const counts = cols.map(c => `<g><title>${c.age}세 ${esc(c.era)} · 외적 ${c.extrinsic}명, 내적 ${c.intrinsic}명</title><text class="count" x="${x(c.age)}" y="${yv(1 + J) - 12}" text-anchor="middle" fill="var(--ext-ink)">${c.extrinsic}</text><text class="count" x="${x(c.age)}" y="${yv(-1 - J) + 34}" text-anchor="middle" fill="var(--int-ink)">${c.intrinsic}</text></g>`).join('');
    // 시기 이름이 이웃 칸까지 닿을 만큼 길면(43·47세) 두 줄로 나눠 겹치지 않게 한다.
    const eraLabel = (c, i) => {
      const near = Math.min(i ? x(c.age) - x(cols[i - 1].age) : 999, i < cols.length - 1 ? x(cols[i + 1].age) - x(c.age) : 999), w = c.era.split(' ');
      const lines = c.era.length * 20 > near - 14 && w.length > 1 ? [w.slice(0, Math.ceil(w.length / 2)).join(' '), w.slice(Math.ceil(w.length / 2)).join(' ')] : [c.era];
      return `<text class="era" x="${x(c.age)}" y="${H - B + 66}" text-anchor="middle">${lines.map((t, k) => `<tspan x="${x(c.age)}" dy="${k ? 24 : 0}">${esc(t)}</tspan>`).join('')}</text>`;
    };
    const svg = `<svg class="dots" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="나이별 외적·내적 선택: ${cols.map(c => `${c.age}세 외적 ${c.extrinsic}명 내적 ${c.intrinsic}명`).join(', ')}">
      ${bands}${cols.map(c => `<line class="guide" x1="${x(c.age)}" x2="${x(c.age)}" y1="${T}" y2="${H - B}"/>`).join('')}
      <line class="grid" x1="${L - 20}" x2="${W - R + 60}" y1="${yv(1)}" y2="${yv(1)}"/><line class="grid" x1="${L - 20}" x2="${W - R + 60}" y1="${yv(-1)}" y2="${yv(-1)}"/>
      <line class="zero" x1="${L - 20}" x2="${W - R + 60}" y1="${yc}" y2="${yc}"/>
      <text class="ylab" x="${L - 34}" y="${yv(1) + 9}" text-anchor="end" fill="var(--ext-ink)">외적 +1</text>
      <text class="ylab" x="${L - 34}" y="${yc + 9}" text-anchor="end" fill="var(--muted)">0</text>
      <text class="ylab" x="${L - 34}" y="${yv(-1) + 9}" text-anchor="end" fill="var(--int-ink)">내적 −1</text>
      ${lines}${dots}${trend}${counts}
      ${cols.map((c, i) => `<text class="age-label" x="${x(c.age)}" y="${H - B + 38}" text-anchor="middle">${c.age}세</text>${eraLabel(c, i)}`).join('')}</svg>`;
    const left = STAGES.filter(st => !st.goals[0]).map(st => `${st.age}`);
    const lineIcon = (w, color, op) => `<svg width="46" height="20" viewBox="0 0 46 20"><path d="M2 16C16 16 30 4 44 4" fill="none" stroke="${color}" stroke-width="${w}" stroke-opacity="${op}" stroke-linecap="round"/></svg>`;
    return `<div class="dots-wrap"><div class="legend"><span><i class="dot" style="background:var(--ext)"></i>외적 목표<small>${esc(famLabels('extrinsic'))}</small></span><span><i class="dot" style="background:var(--int)"></i>내적 목표<small>${esc(famLabels('intrinsic'))}</small></span>
        <span>${lineIcon(3, '#6D4C41', .45)}한 사람의 선택 흐름</span><span class="unit">점 1개 = 한 사람의 선택 1개</span></div>${svg}</div>
      <div class="foot">1차 플레이 ${s.people}명.${tr ? ` 굵은 선은 외적 +1, 내적 −1로 놓고 모든 점과의 RMSE가 가장 작은 ${tr.deg}차 곡선이에요 (RMSE ${tr.rmse.toFixed(2)}).` : ''}${left.length ? ` 두 선택지가 모두 내적인 ${left.join('·')}세 질문은 뺐어요.` : ''}</div>`;
  }

  function viewEndings(s) {
    if (!s.pairs) return empty('2차 플레이가 끝나면 여기에 나타나요.', s.people ? `지금까지 1차 플레이 ${s.people}명` : '');
    const p = pct(s.changed, s.pairs), R = 160, C = 2 * Math.PI * R;
    const ring = `<svg viewBox="-210 -210 420 420" role="img" aria-label="엔딩이 바뀐 사람 ${s.changed}명, 그대로인 사람 ${s.pairs - s.changed}명">
      <circle r="${R}" fill="none" stroke="var(--track)" stroke-width="58"><title>그대로예요 ${s.pairs - s.changed}명</title></circle>
      ${s.changed ? `<circle r="${R}" fill="none" stroke="var(--second)" stroke-width="58" stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"><title>바뀌었어요 ${s.changed}명</title></circle>` : ''}
      <text class="center-small" text-anchor="middle" y="-62">엔딩이 바뀐 사람</text><text class="center-big" text-anchor="middle" y="34">${p}%</text><text class="center-count" text-anchor="middle" y="78">${s.pairs}명 중 ${s.changed}명</text></svg>`;
    const max = Math.max(1, ...ENDINGS.map(e => Math.max(s.before[e.key], s.after[e.key])));
    const bar = (cls, n, name, e) => `<div class="vbar ${cls}" style="height:${n / max * 82}%" title="${esc(e.label)} ${name} ${n}명"><em>${n}</em></div>`;
    const dot = f => f ? `<i style="background:var(--${f === 'extrinsic' ? 'ext' : 'int'})"></i>` : '<i style="background:var(--same)"></i>';
    return `<div class="two"><div class="ring">${ring}<div class="legend"><span><i style="background:var(--second)"></i>바뀌었어요 ${s.changed}명</span><span><i class="light" style="background:var(--track)"></i>그대로예요 ${s.pairs - s.changed}명</span></div></div>
      <div class="bars"><div class="legend"><span><i style="background:var(--first)"></i>1차</span><span><i style="background:var(--second)"></i>2차</span></div>
        <div class="groups" style="--n:${ENDINGS.length}">${ENDINGS.map(e => `<div class="group">${bar('first', s.before[e.key], '1차', e)}${bar('second', s.after[e.key], '2차', e)}</div>`).join('')}</div>
        <div class="xlabels" style="--n:${ENDINGS.length}">${ENDINGS.map(e => `<div>${dot(e.family)}${esc(e.label)}</div>`).join('')}</div>
        <div class="note">${s.top ? `가장 많이 옮겨 간 길: <b>${esc(endingLabel(s.top.from))} → ${esc(endingLabel(s.top.to))}</b> (${s.top.n}명)` : '엔딩이 바뀐 사람이 아직 없어요.'}</div></div></div>`;
  }

  function viewShift(s) {
    if (!s.pairs) return empty('2차 플레이가 끝나면 여기에 나타나요.', s.people ? `지금까지 1차 플레이 ${s.people}명` : '');
    const a = s.firstOfPairs, b = s.second, pa = pct(a.intrinsic, a.intrinsic + a.extrinsic), pb = pct(b.intrinsic, b.intrinsic + b.extrinsic), d = pb - pa;
    const n = s.pairs, max = Math.max(1, s.shift.toInt, s.shift.same, s.shift.toExt);
    const mover = (name, v, color) => `<div class="mover"><b>${name}</b><div class="hb"><i style="width:${v / max * 82}%;background:${color}" title="${name} ${v}명"></i><em>${v}명<small>${pct(v, n)}%</small></em></div></div>`;
    return `<div class="two shift" style="grid-template-columns:1fr 760px"><div>${legendGoals()}
        <div class="hrows"><div class="hrow"><div class="who"><b>1차</b></div>${stack(a.extrinsic, a.intrinsic, '개')}</div><div class="hrow"><div class="who"><b>2차</b></div>${stack(b.extrinsic, b.intrinsic, '개')}</div></div>
        <div class="delta ${d < 0 ? 'ext' : ''}">${d > 0 ? `내적 목표 선택 ${d}%p 늘었어요` : d < 0 ? `외적 목표 선택 ${-d}%p 늘었어요` : '내적·외적 비율이 그대로예요'}</div></div>
      <div><p class="h3">한 사람씩 보면 · 두 번 플레이한 ${n}명</p><div class="movers">${mover('내적 쪽으로 이동', s.shift.toInt, 'var(--int)')}${mover('그대로', s.shift.same, 'var(--same)')}${mover('외적 쪽으로 이동', s.shift.toExt, 'var(--ext)')}</div></div></div>`;
  }

  const VIEWS = [
    { slide: 14, title: '게임의 게이지 그래프', sub: '참가자 전체의 내적, 외적 목표 비율 그래프', draw: viewShare },
    { slide: 15, title: '게임의 게이지 그래프', sub: '나이대에 따른 내적/외적 목표 변화 그래프', draw: viewAge },
    { slide: 26, title: '결과 그래프', sub: '토론 전/후 엔딩의 차이', draw: viewEndings },
    { slide: 27, title: '결과 그래프', sub: '토론 전/후 내적/외적 목표 비율 변화', draw: viewShift },
    { slide: '15-1', title: '게임의 게이지 그래프', sub: '나이에 따른 외적/내적 선택 분포', draw: viewDots },
  ];
  const viewIndex = slide => VIEWS.findIndex(v => String(v.slide) === String(slide));
  let cur = Math.max(0, viewIndex(decodeURIComponent(location.hash.slice(1)))), last = null, extra = {}, status = '';

  function table(s) {
    const row = (...c) => `<tr>${c.map(x => `<td>${x}</td>`).join('')}</tr>`;
    return `<b>표로 보기</b> (T로 닫기)<table><tr><th></th><th>외적</th><th>내적</th></tr>${row('1차 전체', s.first.extrinsic, s.first.intrinsic)}${s.periods.map(p => row(p.name, p.extrinsic, p.intrinsic)).join('')}${row('2차 (두 번 한 사람)', s.second.extrinsic, s.second.intrinsic)}</table>
      ${(() => { const tr = trendOf(s.paths, s.ages.map(c => c.age)); return `<table><tr><th>나이 (15-1)</th><th>외적</th><th>내적</th><th>평균 (+1~−1)</th><th>굵은 선${tr ? ` (${tr.deg}차, RMSE ${tr.rmse.toFixed(3)})` : ''}</th></tr>${s.ages.map(c => row(`${c.age}세 ${esc(c.era)}`, c.extrinsic, c.intrinsic, c.extrinsic + c.intrinsic ? ((c.extrinsic - c.intrinsic) / (c.extrinsic + c.intrinsic)).toFixed(2) : '-', tr ? tr.at(c.age).toFixed(2) : '-')).join('')}</table>`; })()}
      <table><tr><th>엔딩</th><th>1차</th><th>2차</th></tr>${ENDINGS.map(e => row(esc(e.label), s.before[e.key], s.after[e.key])).join('')}</table>
      <table>${row('1차 플레이', `${s.people}명`)}${row('두 번 플레이', `${s.pairs}명`)}${row('엔딩 바뀜', `${s.changed}명`)}${row('내적 쪽 / 그대로 / 외적 쪽', `${s.shift.toInt} / ${s.shift.same} / ${s.shift.toExt}`)}${row('노년기 외적 선택', `${s.oldExt}명`)}</table>`;
  }
  function render() {
    const v = VIEWS[cur];
    $('#title').textContent = v.title; $('#sub').textContent = v.sub;
    if (!ready && !DEMO) $('#view').innerHTML = empty('게이지가 아직 외적·내적 목표로 나뉘지 않았어요.', 'content.json 게이지에 family를 넣으면 나타나요.');
    else if (last) { const s = stats(last); $('#view').innerHTML = v.draw(s); if ($('#table').hidden === false) $('#table').innerHTML = table(s); requestAnimationFrame(drawTrend); }
    $('#nav').innerHTML = `<span class="state">${esc(status)}</span>${VIEWS.map((x, k) => `<button class="${k === cur ? 'on' : ''}" data-v="${k}">${x.slide}번</button>`).join('')}<button data-act="jpg">JPG 저장</button><button data-act="table">표</button><button data-act="clean">숨기기 H</button>`;
    history.replaceState(null, '', `${location.pathname}${location.search}#${v.slide}`);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('#nav button'); if (!b) return;
    if (b.dataset.v) { cur = +b.dataset.v; render(); }
    else if (b.dataset.act === 'jpg') saveJpg(VIEWS[cur].slide);
    else if (b.dataset.act === 'table') { $('#table').hidden = !$('#table').hidden; render(); }
    else if (b.dataset.act === 'clean') document.body.classList.add('clean');
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { cur = Math.min(VIEWS.length - 1, cur + 1); render(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { cur = Math.max(0, cur - 1); render(); }
    else if (/^[1-5]$/.test(k)) { cur = +k - 1; render(); }
    else if (k === 'h' || k === 'H') document.body.classList.toggle('clean');
    else if (k === 't' || k === 'T') { $('#table').hidden = !$('#table').hidden; render(); }
    else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch { /* 무시 */ } }
  });

  // ---------- JPG 내보내기: 화면을 1920×1080의 두 배(3840×2160)로 저장한다 ----------
  const LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
  let libLoad;
  const lib = () => libLoad ||= new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = LIB; sc.onload = () => ok(window.htmlToImage); sc.onerror = () => { libLoad = null; no(new Error('이미지 도구를 불러오지 못했어요.')); }; document.head.appendChild(sc); });
  // 화면에 쓰인 글자만 담은 글꼴을 받아 그림 안에 넣는다 (한글 글꼴 전체는 너무 커서).
  async function fontCss() {
    const text = [...new Set(`${$('#stage').textContent}0123456789%`.replace(/\s/g, ''))].join('');
    let css = await (await fetch(`https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700;800&display=block&text=${encodeURIComponent(text)}`)).text();
    for (const u of [...new Set(css.match(/https:\/\/[^)'"\s]+/g) || [])]) {
      const blob = await (await fetch(u)).blob();
      const data = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
      css = css.split(u).join(data);
    }
    return css;
  }
  // 한 번 그린 캔버스로 JPG(파일 저장)와 PNG(클립보드: 브라우저는 PNG만 받는다)를 만든다.
  async function exportCanvas(slide) {
    const k = viewIndex(slide);
    if (k < 0) throw new Error(`${slide}번 화면이 없어요.`);
    cur = k; render();
    await new Promise(ok => requestAnimationFrame(() => requestAnimationFrame(ok))); drawTrend();
    const [h, css] = await Promise.all([lib(), fontCss()]);
    return h.toCanvas($('#stage'), { width: 1920, height: 1080, pixelRatio: 2, backgroundColor: '#FFFBF2', fontEmbedCSS: css, style: { transform: 'none', left: '0px', top: '0px' } });
  }
  const toJpeg = canvas => canvas.toDataURL('image/jpeg', .95);
  const toPng = canvas => new Promise(ok => canvas.toBlob(ok, 'image/png'));
  async function exportJpg(slide) { return toJpeg(await exportCanvas(slide)); }
  // 클립보드 쓰기는 클릭 직후에 시작해야 허용된다. 그림은 나중에 채워지는 Promise로 넘긴다.
  function copyLater(pngPromise) {
    if (!navigator.clipboard?.write || !window.ClipboardItem) return Promise.resolve(false);
    return navigator.clipboard.write([new ClipboardItem({ 'image/png': pngPromise })]).then(() => true, () => false);
  }
  const fileName = slide => `결과그래프_${slide}번_${new Date().toTimeString().slice(0, 5).replace(':', '')}.jpg`;
  async function saveJpg(slide) {
    status = 'JPG 만드는 중…'; render();
    const canvas = exportCanvas(slide), copied = copyLater(canvas.then(toPng));
    try {
      const a = document.createElement('a'); a.href = toJpeg(await canvas); a.download = fileName(slide); a.click();
      status = (await copied) ? `${slide}번 저장·복사함 (Ctrl+V로 붙여넣기)` : `${slide}번 저장함 (복사는 이 브라우저에서 막힘)`;
    } catch (e) { status = e.message; }
    render();
  }
  window.__results = { slides: VIEWS.map(v => v.slide), exportJpg, exportCanvas, toJpeg, toPng, fileName, show(slide) { const k = viewIndex(slide); if (k >= 0) { cur = k; render(); } } };

  async function refresh() {
    if (DEMO) { last = demoPlays(); extra = { hands_ext: 14, hands_int: 24 }; status = '미리보기 (가상 데이터 38명)'; render(); return; }
    if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) { status = '저장소 연결 안 됨'; $('#view').innerHTML = empty('아직 기록 저장소가 연결되지 않았어요.'); render(); return; }
    const key = CONFIG.supabaseKey, headers = { apikey: key, 'Content-Type': 'application/json' };
    if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`;
    try {
      const call = fn => fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: '{}' });
      const [res, ex] = await Promise.all([call('results_plays'), call('results_extra')]);
      if (ex.ok) extra = await ex.json();
      if (res.ok) { last = await res.json(); status = `${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} 갱신`; }
      else status = res.status === 404 ? 'Supabase에서 schema.sql을 다시 실행해 주세요' : `불러오기 실패 (${res.status})`;
    } catch { status = '연결 끊김, 다시 시도 중'; }
    render();
    setTimeout(refresh, 5000);
  }
  let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2500); });
  (document.fonts?.ready || Promise.resolve()).then(() => { render(); refresh(); }, refresh);
})();
</script>
</body>
