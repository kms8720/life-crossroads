name: Keep database awake

# Free Supabase projects pause after a week with no requests.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Send one request
        run: |
          url=$(jq -r .supabaseUrl config.json)
          key=$(jq -r .supabaseKey config.json)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Database is not configured yet."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null \
            -X POST "$url/rest/v1/rpc/results_summary" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
